hostname: ${hostname}
fqdn: ${hostname}.${domain}
manage_etc_hosts: true
ssh_authorized_keys:
  - ${ssh_public_key}

users:
  # Operator login is ALWAYS created (even with zero extra_users) — otherwise
  # a config without extra users deploys a VM with no SSH login at all.
  - name: ubuntu
    ssh_authorized_keys:
      - ${ssh_public_key}
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: [sudo, adm]
    lock_passwd: true
    shell: /bin/bash
%{ if length(extra_users) > 0 }
%{ for u in extra_users ~}
  - name: ${u.username}
%{ if u.sudo != "" && u.sudo != "NONE" ~}
    sudo: ${u.sudo}
%{ endif ~}
%{ if length(u.groups) > 0 ~}
    groups: [${join(", ", [for g in u.groups : "\"${g}\""])}]
%{ endif ~}
    shell: ${u.shell}
    lock_passwd: false
%{ endfor ~}
%{ endif }

%{ if length(extra_users) > 0 }
%{ if length([for u in extra_users : u if u.password != ""]) > 0 }
chpasswd:
  expire: true
  users:
%{ for u in extra_users ~}
%{ if u.password != "" ~}
    - name: ${u.username}
      password: ${u.password}
      type: text
%{ endif ~}
%{ endfor ~}
%{ endif }
%{ endif }

write_files:
  - path: /etc/netplan/01-static.yaml
    content: |
      network:
        version: 2
        renderer: networkd
        ethernets:
%{ for i, net in networks ~}
          ${net.match_name != "" ? net.match_name : "ens192"}:
            dhcp4: ${net.dhcp}
%{ if net.dhcp == false ~}
            addresses:
              - ${net.ip_address}/${net.netmask}
            routes:
              - to: default
                via: ${net.gateway}
                metric: ${100 + i}
            nameservers:
              addresses: ${jsonencode(net.dns_servers)}
%{ endif ~}
%{ endfor ~}
%{ if length(extra_users) > 0 }
  - path: /etc/vmpilot-access.md
    content: |
${indent(6, format("\n%s", access_manifest))}
    append: false
    permissions: '0644'
%{ endif }
%{ if length(extra_users) > 0 }
  - path: /etc/sudoers.d/99-vmpilot-audit
    content: |
      # VMPilot sudo audit logging — every sudo command is recorded.
      Defaults  logfile = "/var/log/sudo.log"
      Defaults  log_year
      Defaults  loglinelen = 0
    permissions: '0440'
%{ endif }
%{ if length([for u in extra_users : u if u.password != ""]) > 0 }
  # Password logins with forced first change need keyboard-interactive
  # (Ubuntu 24.04 defaults it OFF — without this, expired-password users
  # can neither log in nor change the password). Password auth itself stays
  # template-managed; this only enables the change dialogue.
  - path: /etc/ssh/sshd_config.d/60-vmpilot-kbdinteractive.conf
    content: |
      KbdInteractiveAuthentication yes
    permissions: '0644'
%{ endif }

# ── Hardening script (operator-owned policy, verbatim).
# deploy-vm.sh concatenates secure/<srv>/<vc>/hardening.sh (DC baseline) +
# secure/<srv>/<vc>/<env>/hardening.sh (env extras) and injects the result as
# the `hardening_script` variable (terraform-escaped). What you write is what
# runs — no backend mapping, no keys. It executes AFTER all OS provisioning
# (see runcmd tail); output → /var/log/vmpilot-hardening.log.
# Rules: plain bash only; NO apt (offline first boot — binaries live in the
# template); every step must tolerate re-run; keep it fast (it gates LAN-up).
  - path: /etc/vmpilot/hardening.sh
    content: |
      ${indent(6, hardening_script)}
    permissions: '0750'

bootcmd:bootcmd:
  - systemctl mask systemd-networkd-wait-online.service 2>/dev/null || true
  - swapoff /swapfile 2>/dev/null || true
  - sed -i '\|/swapfile|d' /etc/fstab 2>/dev/null || true
  - rm -f /swapfile /swap.img 2>/dev/null || true
%{ if length(extra_users) > 0 }
%{ if length([for u in extra_users : u if length(u.groups) > 0]) > 0 }
  # ensure role groups exist before users module runs
%{ for u in extra_users ~}
%{ for g in u.groups ~}
  - groupadd -f ${g}
%{ endfor ~}
%{ endfor ~}
%{ endif }
%{ endif }
  # NOTE: no DNS-wait loop and no packages: block on purpose — first boot is
  # FULLY offline-capable (lan-up-last). The template owns all packages
  # (lvm2, cloud-guest-utils, xfsprogs, node_exporter); OS updates are an
  # explicit later step, never a boot dependency.
%{ if disable_auto_updates }
  - systemctl disable --now apt-daily.service apt-daily-upgrade.service apt-daily.timer apt-daily-upgrade.timer unattended-upgrades.service 2>/dev/null || true
  - systemctl mask apt-daily.service apt-daily-upgrade.service apt-daily.timer apt-daily-upgrade.timer unattended-upgrades.service 2>/dev/null || true
%{ endif }

growpart:
  mode: auto
  devices: ["/"]
  ignore_growroot_disabled: false

resize_rootfs: true

# First boot is FULLY offline-capable (lan-up-last): NO packages: block, NO
# network waits. The template owns all required packages (lvm2,
# cloud-guest-utils, xfsprogs, node_exporter binary — see
# docs/template_prepare_for_prod/prod_template.md Phase-4/4a). OS updates are
# an explicit later step (ansible/manual), never a boot dependency, so initial
# VM-ready is never slowed by archive fetches.

runcmd:
  - netplan apply
  # Guest pipeline marker (YAML-safe printf form — no ": " in source; output
  # keeps the ":: STEP " contract; fetched post-LAN into the deploy log).
  - printf '%s STEP %s done ts=%s\n' "::" "provision:network" "$(date +%s)"
  # Pick up the kbdinteractive drop-in (password-change dialogue for
  # expired-password users). Safe: no SSH sessions exist during provisioning.
  - systemctl reload ssh 2>/dev/null || systemctl restart ssh 2>/dev/null || true
  - printf '%s STEP %s done ts=%s\n' "::" "provision:ssh" "$(date +%s)"
%{ if length(os_partitions) > 0 }
  - |
    echo ":: STEP provision:disk-allocate start ts=$(date +%s)"
    growpart /dev/sda 2 2>/dev/null || true
    pvresize /dev/sda2
%{ for part in os_partitions ~}
%{ if part.mount_point == "/" }
    lvextend -L ${part.size} /dev/vg_os/${part.lv_name}
    resize2fs /dev/vg_os/${part.lv_name}
%{ else }
%{ if part.mount_point == "swap" }
    if ! lvs /dev/vg_os/${part.lv_name} &>/dev/null; then
      lvcreate -L ${part.size} -n ${part.lv_name} vg_os
    else
      echo "LV ${part.lv_name} already exists, skipping"
    fi
    mkswap /dev/vg_os/${part.lv_name}
    swapon /dev/vg_os/${part.lv_name}
    echo '/dev/vg_os/${part.lv_name} none swap sw 0 0' >> /etc/fstab
%{ else }
    if ! lvs /dev/vg_os/${part.lv_name} &>/dev/null; then
      lvcreate -L ${part.size} -n ${part.lv_name} vg_os
    else
      echo "LV ${part.lv_name} already exists, skipping"
    fi
    mkfs.${part.filesystem} /dev/vg_os/${part.lv_name}
    ORIG_PERMS=$(stat -c "%a" ${part.mount_point} 2>/dev/null || echo "755")
    TMP_MNT="/mnt/tmp_${part.lv_name}"
    mkdir -p "$TMP_MNT"
    mount /dev/vg_os/${part.lv_name} "$TMP_MNT"
    cp -a ${part.mount_point}/. "$TMP_MNT/" 2>/dev/null || true
    umount "$TMP_MNT"
    rmdir "$TMP_MNT" 2>/dev/null || true
    mkdir -p ${part.mount_point}
    mount /dev/vg_os/${part.lv_name} ${part.mount_point}
    chmod "$ORIG_PERMS" ${part.mount_point}
    echo '/dev/vg_os/${part.lv_name} ${part.mount_point} ${part.filesystem} defaults 0 2' >> /etc/fstab
%{ endif }
%{ endif }
    echo ":: STEP provision:lvm-partition done ${part.lv_name} ts=$(date +%s)"
%{ endfor ~}
%{ endif }
%{ if length(os_partitions) > 0 }
  - printf '%s STEP %s done ts=%s\n' "::" "provision:disk-allocate" "$(date +%s)"
%{ endif }
%{ if ! os_has_swap }
  - |
    if [ ! -f /swapfile ]; then
      fallocate -l ${memory_mb * 3 / 2}M /swapfile 2>/dev/null || dd if=/dev/zero of=/swapfile bs=1M count=${memory_mb * 3 / 2}
      chmod 600 /swapfile
      mkswap /swapfile
      swapon /swapfile
      echo '/swapfile none swap sw 0 0' >> /etc/fstab
    fi
    echo ":: STEP provision:swap done ts=$(date +%s)"
%{ endif }
%{ if length(lvm_config) > 0 }
  - |
    DEVICES="${join(" ", distinct(flatten([for lv in lvm_config : lv.devices])))}"
    for d in $DEVICES; do
      pvcreate -ff -y $d 2>/dev/null || true
    done
%{ for vg in distinct([for lv in lvm_config : lv.vg_name]) ~}
    vgcreate ${vg} $DEVICES 2>/dev/null || true
%{ endfor ~}
    echo ":: STEP provision:lvm-data done ts=$(date +%s)"
%{ for lv in lvm_config ~}
    if ! lvs /dev/${lv.vg_name}/${lv.lv_name} &>/dev/null; then
      lvcreate -L ${lv.lv_size} -n ${lv.lv_name} ${lv.vg_name}
    else
      echo "LV ${lv.lv_name} already exists, skipping"
    fi
%{ endfor ~}
%{ for lv in lvm_config ~}
  - |
    mkfs.${lv.filesystem} /dev/${lv.vg_name}/${lv.lv_name}
    ORIG_PERMS=$(stat -c "%a" ${lv.mount_point} 2>/dev/null || echo "755")
    TMP_MNT="/mnt/tmp_${lv.lv_name}"
    mkdir -p "$TMP_MNT"
    mount /dev/${lv.vg_name}/${lv.lv_name} "$TMP_MNT"
    cp -a ${lv.mount_point}/. "$TMP_MNT/" 2>/dev/null || true
    umount "$TMP_MNT"
    rmdir "$TMP_MNT" 2>/dev/null || true
    mkdir -p ${lv.mount_point}
    mount /dev/${lv.vg_name}/${lv.lv_name} ${lv.mount_point}
    chmod "$ORIG_PERMS" ${lv.mount_point}
    echo '/dev/${lv.vg_name}/${lv.lv_name} ${lv.mount_point} ${lv.filesystem} defaults 0 2' >> /etc/fstab
    echo ":: STEP provision:lvm-mount done ${lv.vg_name}/${lv.lv_name} ts=$(date +%s)"
%{ endfor ~}
%{ endif }
%{ if length(mount_points) > 0 }
%{ for mp in mount_points ~}
  - |
    sleep 1
%{ if mp.filesystem == "swap" }
    mkswap ${mp.device}
    swapon ${mp.device}
    echo '${mp.device} none swap sw 0 0' >> /etc/fstab
%{ else }
    mkfs.${mp.filesystem} -f ${mp.device}
    mkdir -p ${mp.mount_point}
    mount ${mp.device} ${mp.mount_point}
    echo '${mp.device} ${mp.mount_point} ${mp.filesystem} defaults 0 2' >> /etc/fstab
%{ endif }
    echo ":: STEP provision:mounts done ${mp.mount_point} ts=$(date +%s)"
%{ endfor ~}
%{ endif }
%{ if length(extra_users) > 0 }
  # Extra users created via cloud-init users module above — verify here so the
  # pipeline shows per-ID creation (ID creation checkpoint).
  - |
    for _u in %{ for u in extra_users }${u.username} %{ endfor ~}; do
      [ -n "$_u" ] && id "$_u" >/dev/null 2>&1 && echo ":: STEP provision:users done $_u ts=$(date +%s)"
    done
%{ endif }
  # Operator login checkpoint (ubuntu exists either from the image or users above).
  - |
    if id ubuntu >/dev/null 2>&1; then echo ":: STEP provision:users done ubuntu ts=$(date +%s)"; else echo ":: STEP provision:users fail ubuntu ts=$(date +%s)"; fi
  # Dependency tools checkpoint (template owns them; provision proves it).
  - |
    _miss=""
    for _t in lvextend growpart mkfs.xfs mkfs.ext4 pvcreate vgextend vgcreate lvcreate; do
      command -v "$_t" >/dev/null 2>&1 || _miss="$_miss $_t"
    done
    if [ -z "$_miss" ]; then echo ":: STEP provision:deps done ts=$(date +%s)"; else echo ":: STEP provision:deps fail missing:$_miss ts=$(date +%s)"; fi
  # Root-access checkpoint (ubuntu passwordless sudo for deploy operator).
  - |
    if sudo -n -U ubuntu true 2>/dev/null || sudo -l -U ubuntu 2>/dev/null | grep -q "NOPASSWD"; then echo ":: STEP provision:root-access done ubuntu ts=$(date +%s)"; else echo ":: STEP provision:root-access fail ubuntu ts=$(date +%s)"; fi
%{ if enable_node_exporter }
  - |
    echo ":: STEP provision:node-exporter start ts=$(date +%s)"
    if [ ! -f /usr/local/bin/node_exporter ]; then
      wget -T 20 -qO /tmp/ne.tar.gz https://github.com/prometheus/node_exporter/releases/download/v1.8.2/node_exporter-1.8.2.linux-amd64.tar.gz 2>/dev/null && tar -xzf /tmp/ne.tar.gz -C /tmp/ && install -m 0755 /tmp/node_exporter-1.8.2.linux-amd64/node_exporter /usr/local/bin/node_exporter && rm -rf /tmp/node_exporter-* /tmp/ne.tar.gz || true
    fi
    if [ -f /usr/local/bin/node_exporter ]; then
      id node_exporter >/dev/null 2>&1 || useradd --system --no-create-home --shell /usr/sbin/nologin node_exporter || true
      chown node_exporter:node_exporter /usr/local/bin/node_exporter 2>/dev/null || true
      { echo "[Unit]"; echo "Description=Prometheus Node Exporter"; echo "After=network-online.target"; echo "Wants=network-online.target"; echo "[Service]"; echo "User=node_exporter"; echo "Group=node_exporter"; echo "ExecStart=/usr/local/bin/node_exporter"; echo "Restart=always"; echo "RestartSec=10"; echo "[Install]"; echo "WantedBy=multi-user.target"; } > /etc/systemd/system/node_exporter.service
      systemctl daemon-reload
      systemctl enable --now node_exporter 2>/dev/null || true
    fi
    if systemctl is-active --quiet node_exporter 2>/dev/null; then echo ":: STEP provision:node-exporter done ts=$(date +%s)"; else echo ":: STEP provision:node-exporter fail ts=$(date +%s)"; fi
%{ endif }
  # Hardening: DELIVERED here (/etc/vmpilot/hardening.sh), EXECUTED later.
  # It runs AFTER LAN is up (deploy-vm.sh lan_up over SSH — with network, so
  # apt-backed steps work). First boot stays fully offline: OS provisioning
  # only, then poweroff for LAN-up. Never executed here.
  - echo "hardening policy delivered = $(wc -l < /etc/vmpilot/hardening.sh 2>/dev/null || echo 0) lines (runs post-LAN via deploy)"
  - printf '%s STEP %s done lines=%s ts=%s\n' "::" "provision:policy-delivered" "$(wc -l < /etc/vmpilot/hardening.sh 2>/dev/null || echo 0)" "$(date +%s)"
  # Offline first boot (lan-up-last): no global IPv4 means the LAN cable is
  # disconnected. Every local provisioning step above is complete — power off
  # so deploy connects the LAN onto a fully-provisioned guest (no network
  # fetch can delay readiness afterwards). Online boots skip this entirely.
  # Power state IS the completion signal (observable via govc, no network).
  - |
    if [ -z "$(ip -4 addr show scope global 2>/dev/null | grep -oP 'inet \K[0-9.]+' | grep -v '^169\.254\.')" ]; then
      echo "VMPilot: offline first boot complete — powering off for LAN-up"
      poweroff
    fi

final_message: "VMPilot provisioning complete"
