# ===========================================================================
# vm-defaults.conf — Central defaults for create-vm-config.sh
# ===========================================================================
# EDIT THIS FILE to change the defaults that create-vm-config.sh proposes.
# When a prompt says "[value]" and you press Enter, the value below is used.
# This file is optional: if it is missing, the script falls back to its
# built-in defaults. Source it in scripts if you want the same values there.
#
# ALSO USED BY:
#   scripts/vcenter-setup.sh  → existing-env inventory defaults load from
#                               secure/<env>/vcenter.tfvars (per-env, NOT here)
#
# NOTE: vCenter inventory (datacenter/cluster/datastore/network/template/
#       resource_pool) is NOT here. It is per-env (multi-vCenter) and lives in
#       secure/<env>/vcenter.tfvars — set via vcenter-setup.sh.
#
# Syntax: simple key=value lines. No spaces around "=" unless quoted.
# ===========================================================================

# ── Identity ──────────────────────────────────────────────────────────────
DEFAULT_VM_NAME="myvm"                     # proposed VM name (can change)
DEFAULT_ANNOTATION="Server"                # "{VMNAME} Server" unless changed

# ── Hardware defaults ─────────────────────────────────────────────────────
DEFAULT_CPU="2"
DEFAULT_RAM="4"                            # GB
DEFAULT_FIRMWARE="efi"
DEFAULT_CPU_HOT_ADD="Y"                    # Y/N
DEFAULT_MEM_HOT_ADD="Y"                    # Y/N
DEFAULT_OS_DISK_GB="40"                    # min enforced = template disk size
DEFAULT_BOOT_SIZE="512M"                   # boot/efi partition (512M / 1G)
DEFAULT_PROVISIONING="1"                   # 1=thin 2=thick 3=eager

# ── OS partition default layout (mount_point:size, filesystem=xfs) ───────
DEFAULT_MOUNTS=("/:10" "/home:2" "/var:8" "/tmp:1")
TEMPLATE_DISK_GB=40                        # clone can't be smaller than this

# ── Data disk ─────────────────────────────────────────────────────────────
DEFAULT_DATA_DISK="N"                      # add data disk by default? Y/N
DEFAULT_DATA_DISK_GB="30"
DEFAULT_DATA_PROVISIONING="1"              # 1=thin 2=thick 3=eager

# ── SSH / users ───────────────────────────────────────────────────────────
# empty = script auto-detects ~/.ssh/id_*.pub and asks to use it
DEFAULT_SSH_KEY=""
DEFAULT_EXTRA_USER_PASSWORD=""

# ── Behavior ──────────────────────────────────────────────────────────────
DEFAULT_DISABLE_AUTO_UPDATES="Y"           # recommended for DB/prod
DEFAULT_SWAP="N"                           # swap suggestion prompt default
