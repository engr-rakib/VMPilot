limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;

# ---------------------------------------------------------------------------
# HTTP -> HTTPS redirect
# ---------------------------------------------------------------------------
server {
  listen 80;
  listen [::]:80;
  server_name _;
  return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# HTTPS server — only exposed surface of the whole stack
# ---------------------------------------------------------------------------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;

  # Security headers
  include /etc/nginx/conf.d/headers.conf;

  root /usr/share/nginx/html;
  index index.html;

  # Never cache the entry HTML; cache static assets aggressively
  location = /index.html {
    include /etc/nginx/conf.d/headers.conf;
    add_header Cache-Control "no-store";
  }
  location ~ ^/(assets|css|js|vendor)/ {
    include /etc/nginx/conf.d/headers.conf;
    # No-build ES modules keep the same filenames → `immutable` would pin stale
    # code for 30d. Revalidate with ETag instead so edits show up on refresh.
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  # Login is rate-limited (5/min/IP) to blunt brute force
  location = /api/auth/login {
    limit_req zone=login_zone burst=5 nodelay;
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API proxy — ^~ prefix so it always wins over the file-denial regexes
  # below (e.g. VM configs end in .tfvars and must NOT be blocked).
  location ^~ /api/ {
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Origin-Agent-Cluster;
  }

  # socket.io (terminal, future live jobs/chat) — WebSocket upgrade
  location /socket.io/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Origin-Agent-Cluster;
    proxy_read_timeout 24h;
  }

  # When proxying to the app, strip COOP/OAC that may be set by the backend
  # so browsers don't warn for non-HTTPS origins during local/dev use.
  # root catch-all (serves SPA). proxy_hide_header already applied above.

  location / {
    try_files $uri /index.html;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Origin-Agent-Cluster;
  }

  # No dotfiles, no key material
  location ~ /\.    { deny all; }
  location ~* \.(env|htpasswd|pem|key|crt|tfvars|tf)$ { deny all; }
}
